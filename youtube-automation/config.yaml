# ── Channel configuration ───────────────────────────────────────────────
# Everything the pipeline needs to know about WHAT to make and HOW it looks.
# Edit this file; no code changes required for day-to-day operation.

channel:
  # Set a real name + @handle before your first PUBLIC upload (see README).
  name: "One-Person Ledger"          # placeholder working title
  handle: "@oneperson-ledger"        # placeholder
  niche: "AI tools & systems for solo accountants and one-person businesses"
  language: "en"

brand:
  primary: "#0B3D2E"   # deep green  -> trust / finance
  accent:  "#20C997"   # teal        -> highlights, CTAs
  bg:      "#0B0F0D"   # near-black  -> premium explainer backdrop
  text:    "#F5F7F6"   # off-white
  muted:   "#8A938E"   # secondary text

# Which external service each stage uses. The pipeline runs fully offline on
# the 'stub'/'piper' defaults (no API keys). Swap to paid providers for
# production quality — see .env.example for the keys each one needs.
providers:
  llm:    "stub"     # stub (offline, seeded) | gemini | anthropic
  voice:  "piper"    # piper (offline) | openai | elevenlabs
  images: "none"     # none | gemini | openai   (AI still generation, optional)

video:
  format: "pillar"   # pillar = 16:9 flagship | short = 9:16 vertical
  fps: 30
  # music: added in production from YouTube's free Audio Library (see README)

cadence:
  pillars_per_week: 2   # 7-10 min long-form (the money format)
  shorts_per_week: 4    # 30-50s vertical (the subscriber funnel)
